<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlfyTech — Owner Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">AlfyTech</a>
      <div>
        <a href="/user.html" class="btn btn-light">Explore Products</a>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="mb-4">Owner Dashboard</h1>

    <div id="loginSection">
      <p>This dashboard is protected by a demo login (insecure). Use the owner credentials from README to sign in.</p>
      <form id="ownerLoginForm" class="row g-3 mb-4" style="max-width:480px;">
        <div class="col-12">
          <label class="form-label">Email</label>
          <input type="email" id="ownerEmail" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Password</label>
          <input type="password" id="ownerPassword" class="form-control" required>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" id="ownerLoginBtn">Sign in</button>
        </div>
      </form>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="mb-4">
        <button id="logoutBtn" class="btn btn-outline-secondary">Log out</button>
      </div>

      <h3>Add / Publish Ad</h3>
      <form id="addAdForm" class="row g-3 mb-4" style="max-width:640px;">
        <div class="col-12">
          <label class="form-label">Title</label>
          <input id="adTitle" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea id="adDesc" class="form-control" rows="3"></textarea>
        </div>
        <div class="col-6">
          <label class="form-label">Price</label>
          <input id="adPrice" class="form-control" type="text">
        </div>
        <div class="col-6">
          <label class="form-label">Image URL</label>
          <input id="adImage" class="form-control" type="url">
        </div>
        <div class="col-12">
          <button class="btn btn-success">Add Ad</button>
        </div>
      </form>

      <h3>Your Ads</h3>
      <div id="ownerAds" class="row g-3"></div>
    </div>

  </main>

  <footer class="bg-dark text-white text-center py-3">
    <div class="container">© AlfyTech</div>
  </footer>

  <script src="/assets/js/app.js"></script>
</body>
</html>
